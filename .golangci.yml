version: "2"
run:
  go: "1.24"
  build-tags:
    - with_quic
    - with_dhcp
    - with_wireguard
    - with_utls
    - with_acme
    - with_clash_api
    - with_tailscale
    - with_ccm
    - with_ocm
    - badlinkname
    - tfogo_checklinkname0
linters:
  default: none
  enable:
    - ineffassign
    - staticcheck
    - unused
    - modernize
  settings:
    modernize:
      disable:
        - omitzero # nested struct omitempty -> omitzero changes JSON output semantics
        - embedlit # 可省略嵌入欄位型別；與已停用的 QF1008 同類，且上游大量使用顯式嵌入欄位寫法
    staticcheck:
      checks:
        - all
        - -QF1008 # could remove embedded field "<interface>" from selector
        - -ST1003 # should not use ALL_CAPS in Go names; use CamelCase instead
        - -QF1001 # could apply De Morgan's law
        - -SA4023 # impossible nil comparison, false positive on platform-specific implementations
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
    rules:
      # x/net v0.58 起把 golang.org/x/net/http2 整組標成 deprecated（改推 net/http 的
      # HTTP2Config）。本倉要用 http2 的裸連線／自訂 ConnPool／自訂 DialTLSContext 路徑
      # （h2 傳輸層、grpclite、Reality、xhttp、web_bridge 的 TrailerPrefix），換成 net/http
      # 那套等於重寫 transport/http 與 common/httpclient，且上游 SagerNet 目前還停在
      # x/net v0.57、還沒Migration，我們搶先改會在合併時整片衝突。
      # 因此只擋「被棄用的符號本身屬於 x/net/http2 套」這一類 SA1019，
      # 其他套的 deprecation（含 golang.org/x 其他子樹）照樣會紅。
      - linters:
          - staticcheck
        text: 'SA1019: \(?\*?golang\.org/x/net/http2\.'
    paths:
      - transport/simple-obfs
      - \.pb\.go$
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofumpt
  settings:
    gci:
      sections:
        - standard
        - prefix(github.com/sagernet/)
        - default
      custom-order: true
