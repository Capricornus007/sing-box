name: Test

on:
  push:
    branches:
      - stable
      - testing
      - unstable
      - 1.15.x
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/test.yml'
  pull_request:
    branches:
      - stable
      - testing
      - unstable
      - 1.15.x

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  # 自家 fork 的 sing 系模組推的是真 tag，但 go.mod 宣告 go 1.28（未發佈版），
  # 公開代理一律拒發——走直連 git 抓（runner https 可達公開倉）。
  GOPRIVATE: github.com/Capricornus007

jobs:
  test:
    name: Test
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Go 吃 feed 的 go-git = golang/go master tip（與用戶機同源）。
      # 為什麼不用 actions/setup-go、裝不到為什麼要紅：理由寫在該 composite 裡
      # （feed 倉 .github/actions/setup-feed-go），各倉不重複抄。
      - name: Install Go from the feed (golang/go master tip)
        uses: Capricornus007/repo/.github/actions/setup-feed-go@master
      - name: Set build tags and ldflags
        shell: bash
        run: |
          echo "BUILD_TAGS=$(cat release/DEFAULT_BUILD_TAGS_OTHERS)" >> "$GITHUB_ENV"
          echo "LDFLAGS_SHARED=$(cat release/LDFLAGS)" >> "$GITHUB_ENV"
      - name: Test
        run: go test -v -exec sudo -tags "$BUILD_TAGS" -ldflags "$LDFLAGS_SHARED" ./...
