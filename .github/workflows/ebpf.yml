name: Build eBPF

on:
  workflow_dispatch:
  push:
    branches:
      - feat/ebpf-inbound
  pull_request:
    branches:
      - feat/ebpf-inbound

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: with_ebpf ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: android, goarch: arm64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: amd64 }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.1
          cache: false
      - name: Cache Go modules
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.goos }}-${{ matrix.goarch }}-${{ hashFiles('**/go.sum') }}
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |-
          go build -v -tags "with_gvisor with_ebpf" ./...
      - name: Test eBPF backend
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        env:
          CGO_ENABLED: "0"
        run: |-
          go test -count=1 -tags with_ebpf ./common/ebpf/...
      - name: Save Go modules cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.goos }}-${{ matrix.goarch }}-${{ hashFiles('**/go.sum') }}
