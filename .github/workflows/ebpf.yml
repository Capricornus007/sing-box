name: Build eBPF

on:
  workflow_dispatch:
  push:
    branches:
      - feat/ebpf-inbound
  pull_request:
    branches:
      - feat/ebpf-inbound

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: with_ebpf ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # eBPF 後端宣稱無 cgo，所以這條用 CGO_ENABLED=0 驗它本身；整棵 ./... 的
          # Android 產物由 build.yml 負責（那條有 NDK r28 且 CGO_ENABLED=1，
          # 整棵樹裡的 service/ocm 等套件需要 cgo，純 Go 環境編不過）。
          - { goos: android, goarch: arm64, targets: "./common/ebpf/... ./option/... ./protocol/ebpf/... ./cmd/sing-box", test: false }
          - { goos: linux, goarch: arm64, targets: "./...", test: false }
          - { goos: linux, goarch: amd64, targets: "./...", test: true }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Go from the feed (golang/go master tip)
        uses: Capricornus007/repo/.github/actions/setup-feed-go@master
      - name: Cache Go modules
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.goos }}-${{ matrix.goarch }}-${{ hashFiles('**/go.sum') }}
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          TARGETS: ${{ matrix.targets }}
        run: |-
          # TARGETS 是空格分隔的多個套件樣本，這裡就是要它展開
          # shellcheck disable=SC2086
          go build -v -tags "with_gvisor with_ebpf" ${TARGETS}
      - name: Test eBPF backend
        if: matrix.test
        env:
          CGO_ENABLED: "0"
        run: |-
          go test -count=1 -tags with_ebpf ./common/ebpf/... ./protocol/ebpf/...
      - name: Save Go modules cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.goos }}-${{ matrix.goarch }}-${{ hashFiles('**/go.sum') }}
