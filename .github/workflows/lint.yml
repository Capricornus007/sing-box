name: Lint

on:
  push:
    branches:
      - oldstable
      - stable
      - testing
      - unstable
      - 1.15.x
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/lint.yml'
  workflow_dispatch:
  pull_request:
    branches:
      - oldstable
      - stable
      - testing
      - unstable
      - 1.15.x

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: arm
          - goos: linux
            goarch: '386'
          # 用戶 2026-10-11 裁：其他系統整條刪，Lint 也只留 Linux 與 Android。
          - goos: android
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Go from the feed (golang/go master tip)
        uses: Capricornus007/repo/.github/actions/setup-feed-go@master
      - name: Cache go module
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
          key: go-${{ hashFiles('**/go.sum') }}
      # 不能用 golangci/golangci-lint-action：它（v2.14.0 連 main）釘 x/tools v0.50.0，
      # 而那顆讀不了 go tip 的 std export data → 十個矩陣目標全紅（run #65）。
      # 換依賴重 build 的步驟與實測交叉表在 feed 倉 .github/actions/setup-gcl。
      - name: Install golangci-lint that reads Go tip export data
        uses: Capricornus007/repo/.github/actions/setup-gcl@master
        with:
          goos: ${{ matrix.goos }}
          goarch: ${{ matrix.goarch }}
      - name: golangci-lint
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: golangci-lint run --timeout=30m
