name: Probe cross-repo composite action

# 一次性探針（2026-10-11）：驗證「別的倉的 .github/actions 目錄下的 composite」
# 到底該怎麼寫 uses:，好讓各倉共用 feed 倉那顆 go-git 安裝步驟，而不是
# 12 個倉各拷貝一份。只開 workflow_dispatch，推上去不會自己跑。
# 驗完就刪。

on:
  workflow_dispatch:

jobs:
  slash:
    name: owner/repo/.github/actions/... 單斜線
    runs-on: ubuntu-latest
    steps:
      - uses: Capricornus007/repo/.github/actions/setup-feed-go@master

  dslash:
    name: owner/repo//.github/actions/... 雙斜線
    runs-on: ubuntu-latest
    steps:
      - uses: Capricornus007/repo//.github/actions/setup-feed-go@master
